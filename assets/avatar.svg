<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Avatar de Pablo Saim Isidro Castillo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="0.55" stop-color="#120c26"/>
      <stop offset="1" stop-color="#0a0714"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a855f7" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#grid)"/>

  <circle cx="240" cy="240" r="176" fill="none" stroke="#a855f7" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="240" cy="240" r="156" fill="#0d0a1a" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>

  <!-- circuitos decorativos -->
  <g fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
    <path d="M84 178h44l18-18h38"/>
    <path d="M84 302h44l18 18h38"/>
    <path d="M396 178h-44l-18-18h-38"/>
    <path d="M396 302h-44l-18 18h-38"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="84" cy="178" r="5"/><circle cx="84" cy="302" r="5"/>
    <circle cx="396" cy="178" r="5"/><circle cx="396" cy="302" r="5"/>
  </g>

  <!-- monograma -->
  <text x="240" y="258" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="132" font-weight="700" fill="url(#accent)" letter-spacing="2">PS</text>
  <text x="240" y="306" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" letter-spacing="4" fill="#b9aee0">CIBERSEGURIDAD · REDES</text>

  <rect x="168" y="340" width="144" height="3" rx="1.5" fill="url(#accent)" opacity=".8"/>
</svg>
